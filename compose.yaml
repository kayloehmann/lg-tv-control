services:
  lg-tv-control:
    build:
      context: .
      args:
        APP_UID: ${PUID:-1026}
    container_name: lg-tv-control
    restart: unless-stopped
    ports:
      - "3083:3000"
    env_file:
      - .env
    environment:
      TV_SSH_KEY_PATH: /run/secrets/tv_ssh_key
      TV_KNOWN_HOSTS_PATH: /run/secrets/known_hosts
      AUTOMATION_TOKEN_PATH: /run/secrets/lg_tv_ha_token
      TV_HOST: ${TV_HOST}
      BEDROOM_TV_HOST: ${BEDROOM_TV_HOST}
      TV_MAC: ${TV_MAC}
      BEDROOM_TV_MAC: ${BEDROOM_TV_MAC}
      WOL_BROADCAST: ${WOL_BROADCAST}
      HISTORY_PATH: /data/history.json
      SYSTEM_BACKUP_DIR: /data/backups
    volumes:
      - ${SSH_PRIVATE_KEY_PATH}:/run/secrets/tv_ssh_key:ro
      - ${SSH_KNOWN_HOSTS_PATH}:/run/secrets/known_hosts:ro
      - ./secrets/lg_tv_ha_token:/run/secrets/lg_tv_ha_token:ro
      - /volume1/docker/lg-tv-control/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
