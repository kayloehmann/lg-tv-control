            heading: Gemeinsame Aktionen
            icon: mdi:remote-tv
          - type: button
            entity: script.lg_tv_alle_ausschalten
            name: Alle Fernseher ausschalten
            icon: mdi:television-off
            show_state: false
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.lg_tv_alle_ausschalten
              confirmation:
                text: Wirklich beide Fernseher ausschalten?
          - type: markdown
            content: >-
              Für Einstellungen, Backup und die vollständige Fernbedienung:
